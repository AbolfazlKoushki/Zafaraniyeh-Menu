<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منوی هایپر نان و کافه بیکری زعفرانیه</title>
<meta name="theme-color" content="#2a1052">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
:root{
  --ink:#2a1052; --ink2:#4a2a85; --saffron:#ffbe2e; --blush:#ece0ff; --paper:#f6f2fd; --card:#ffffff; --text:#1f1535;
  /* برای عکس هدر: آدرس عکس خودتان را اینجا بگذارید، مثلا url('cafe.jpg') */
  --hero-img:none;
  /*برای فوتر گذاشتم سورس*/
  .dev-footer {
  margin-top: 40px;
  padding: 18px 12px;
  text-align: center;
  background: #f6f2fd;
  color: #1f1535;
  border-top: 3px solid #c8a46a;
  font-size: 0.9rem;
}
.dev-footer .brand {
  color: #c8a46a;
  font-weight: 700;
}
.dev-footer a.phone {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 14px;
  border: 1px solid #c8a46a;
  border-radius: 20px;
  color: #e9dcc9;
  text-decoration: none;
  direction: ltr;
  transition: all 0.2s;
}
.dev-footer a.phone:hover {
  background: #c8a46a;
  color: #2b1d14;
}
}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--paper);color:var(--text);}
/* ---------- Hero ---------- */
.hero{position:relative;color:#fff;overflow:hidden;padding:3.2rem 0 5.5rem;
  background:var(--hero-img),radial-gradient(circle at 85% 8%,rgba(255,190,46,.35),transparent 32%),radial-gradient(circle at 15% 20%,#6a3bd1 0,transparent 45%),radial-gradient(circle at 90% 80%,#1a0838 0,transparent 50%),var(--ink);
  background-size:cover;background-position:center;}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;
  background-image:radial-gradient(#fff 1.2px,transparent 1.3px);background-size:22px 22px;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:48px;background:var(--paper);
  clip-path:ellipse(60% 100% at 50% 100%);}
.hero .wrap{position:relative;z-index:1}
.logo{width:116px;height:116px;border-radius:50%;background:var(--saffron);display:grid;place-items:center;
  box-shadow:0 0 0 8px rgba(255,190,46,.22),0 0 0 18px rgba(255,190,46,.1);}
.steam path{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none;opacity:0;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.cafe-name{font-weight:900;font-size:clamp(1.9rem,5.6vw,3.5rem);letter-spacing:-.5px;line-height:1.1}
.cafe-name span{color:var(--saffron)}
.tagline{font-weight:300;font-size:1.05rem;opacity:.85;max-width:34rem}
.hero-chip{display:inline-flex;gap:.4rem;align-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:.35rem .9rem;font-size:.85rem}
/* ---------- Category bar ---------- */
.cat-bar{position:sticky;top:0;z-index:20;background:rgba(246,242,253,.92);backdrop-filter:blur(10px);
  padding:.75rem 0;padding-top:calc(.75rem + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(42,16,82,.08)}
.cat-scroll{display:flex;gap:.6rem;overflow-x:auto;padding:.2rem .25rem;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex:0 0 auto;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:.55rem 1.05rem;
  font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.5rem;box-shadow:0 1px 0 rgba(42,16,82,.08);
  transition:background .2s,color .2s,transform .2s}
.cat-btn .em{font-size:1.25rem}
.cat-btn:hover{transform:translateY(-2px)}
.cat-btn.active{background:var(--ink);color:#fff;box-shadow:0 8px 18px rgba(42,16,82,.28)}
.cat-btn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
/* ---------- Section ---------- */
.sec-head{display:flex;align-items:center;gap:.9rem;margin:1.6rem 0 1.1rem}
.sec-head .big{width:58px;height:58px;border-radius:20px;background:var(--blush);display:grid;place-items:center;font-size:1.9rem;transform:rotate(-6deg)}
.sec-head h2{font-weight:900;margin:0;font-size:1.7rem}
.sec-head small{display:block;color:#6d6490;font-weight:400}
.sec-head .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);opacity:.18}
.panel{display:none}.panel.show{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ---------- Items ---------- */
.item{background:var(--card);border-radius:22px;overflow:hidden;height:100%;display:flex;flex-direction:column;
  border:1px solid rgba(42,16,82,.06);transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(42,16,82,.12)}
.item .pic{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--blush),#fff6dc);display:grid;place-items:center;font-size:3.2rem;overflow:hidden}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .body{padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
.item h3{font-size:1rem;font-weight:800;margin:0}
.item p{margin:0;font-size:.78rem;color:#6d6490;line-height:1.7;flex:1}
.price{align-self:flex-start;margin-top:.5rem;background:var(--ink);color:var(--saffron);border-radius:12px;padding:.25rem .7rem;font-weight:800;font-size:.95rem}
.price small{font-size:.65rem;font-weight:400;color:#fff;opacity:.8;margin-inline-start:.25rem}
.badge-new{position:absolute;top:.6rem;inset-inline-start:.6rem;z-index:1;background:var(--saffron);color:var(--ink);font-size:.7rem;font-weight:800;border-radius:9px;padding:.15rem .55rem}
footer{background:var(--ink);color:#fff;text-align:center;padding:2rem 1rem;margin-top:3rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
.contact{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.contact a{display:inline-flex;align-items:center;gap:.5rem;color:#fff;text-decoration:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:.5rem 1rem;font-size:.9rem;transition:background .2s,color .2s}
.contact a:hover{background:var(--saffron);color:var(--ink)}
.contact a:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
footer .small{opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="hero">
  <div class="container wrap text-center">
    <div class="d-flex justify-content-center mb-4">
      <div class="logo" role="img" aria-label="لوگوی هایپر نان زعفرانیه">
        <svg width="70" height="70" viewBox="0 0 64 64">
          <g class="steam"><path d="M24 20c-3-4 3-6 0-11"/><path d="M32 20c-3-4 3-6 0-12"/><path d="M40 20c-3-4 3-6 0-11"/></g>
          <path d="M14 28h34v10a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z" fill="#2a1052"/>
          <path d="M48 31h4a6 6 0 0 1 0 12h-5" stroke="#2a1052" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="31" cy="28" rx="17" ry="3" fill="#4a2a85"/>
          <path d="M10 57h42" stroke="#2a1052" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <h1 class="cafe-name">هایپر نان و کافه بیکری <span>زعفرانیه</span></h1>
    <p class="tagline mx-auto mt-3">نان داغ، قهوه‌ی تازه و شیرینی‌های خانگی</p>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
      <span class="hero-chip">🕗 هر روز ۸ صبح تا ۱۱ شب</span>
    </div>
  </div>
</header>

<!-- ===== Categories ===== -->
<nav class="cat-bar" aria-label="دسته‌بندی منو">
  <div class="container"><div class="cat-scroll" id="cats" role="tablist"></div></div>
</nav>

<main class="container pb-4" id="menu"></main>

<footer>
  <div class="fw-bold fs-5 mb-3">هایپر نان و کافه بیکری زعفرانیه ☕</div>
  <div class="contact">
    <a href="#" target="_blank" rel="noopener"><span>📸</span><bdi dir="ltr">@</bdi></a>
    <a href="tel:09337063380"><span>📞</span><bdi dir="ltr">09059885527</bdi></a>
    <a href="https://maps.google.com/?q=هتل آبشار آب سفید الیگودرز" target="_blank" rel="noopener"><span>📍</span>هتل آبشار آب سفید الیگودرز</a>
  </div>
  <div class="small mt-3">قیمت‌ها به تومان است</div>
</footer>
  <footer class="dev-footer">
  <div>ساخته شده توسط <span class="brand">(ابوالفضل کوشکی(مستر سورس</span></div>
  <a class="phone" href="tel:09059885527">📞 09059885527</a>
  </footer>

<script>
/* ===== داده‌های منو: اینجا را ویرایش کنید ===== */
const MENU = [
 {id:'hot',  t:'نوشیدنی گرم', s:'گرم و دلچسب', e:'☕', items:[
  ['اسپرسو','تک شات، غلیظ و خوش‌عطر','🫘',85],['آمریکانو','اسپرسو با آب داغ','☕',90],['کاپوچینو','اسپرسو، شیر و فوم ابریشمی','☕',125,1],
  ['لاته','اسپرسو با شیر بخارداده','🥛',130],['موکا','اسپرسو، شکلات و خامه','🍫',145],['هات چاکلت','شکلات بلژیکی غلیظ','🍫',140],
  ['چای ماسالا','چای، شیر و ادویه‌های هندی','🫖',95],['دمنوش بهارنارنج','گل بهارنارنج و عسل','🌼',90]]},
 
  {id:'cold', t:'نوشیدنی سرد', s:'خنک و ترد', e:'🧊', items:[
  ['آب معدنی','۳۳۰ میلی‌لیتر','💧',25],['نوشابه','کوکا، فانتا، اسپرایت','🥤',35],['دوغ محلی','با نعنای تازه','🥛',40],
  ['آیس‌تی هلو','چای سرد با طعم هلو','🍑',85],['لیموناد','لیمو تازه و نعنا','🍋',90],['آبمیوه طبیعی','پرتقال، هویج یا هندوانه','🍊',100,1]]},
 
  {id:'ice',  t:'قهوه سرد و شیک', s:'اسموتی و میلک‌شیک', e:'🥤', items:[
  ['آیس لاته','لاته روی یخ','🧋',135],['کلد برو','۱۲ ساعت دم‌آوری سرد','🧊',140,1],['میلک‌شیک شکلات','بستنی وانیلی و کاکائو','🍦',150],
  ['اسموتی توت‌فرنگی','توت، موز و ماست','🍓',145],['فراپاچینو کارامل','یخ‌ساییده با سس کارامل','🍮',155],['شیک نوتلا','نوتلا، شیر و بستنی','🍫',165]]},

  {id:'bf',   t:'صبحانه', s:'شروع روز', e:'🍳', items:[
  ['صبحانه ایرانی','نان، پنیر، گردو، تخم‌مرغ، چای','🫓',210],['املت','گوجه، تخم‌مرغ، نان سنگک','🍳',130],['نیمرو با قارچ','دو تخم‌مرغ و قارچ سرخ‌شده','🍄',140],
  ['پنکیک عسل','سه لایه با کره و عسل','🥞',150,1],['حلیم','دارچین و شکر یا کره','🥣',90],['املت اسفناج','اسفناج و پنیر فتا','🥬',150]]},

  {id:'sand', t:'ساندویچ و نان', s:'سیر و خوشمزه', e:'🥪', items:[
  ['کلاب ساندویچ','مرغ، بیکن، کاهو، گوجه','🥪',210],['باگت پنیر و ژامبون','نان باگت تازه‌پز','🥖',170],['تست پنیر و گوجه','نان تست، پنیر ذوب‌شده','🍞',130],
  ['کروسان کره‌ای','تازه از فر','🥐',95],['نان سیر','با پنیر موزارلا','🧄',85],['هات‌داگ','سوسیس گوشت و سس مخصوص','🌭',150]]},
 
  {id:'cake', t:'کیک', s:'برش‌های روز', e:'🍰', items:[
  ['چیزکیک نیویورکی','با سس توت‌فرنگی','🍰',160,1],['کیک شکلاتی','سه لایه با گاناش','🎂',140],['کیک هویج','با مغز گردو و کرم‌چیز','🥕',135],
  ['ردولوت','کیک مخملی قرمز','❤️',150],['کیک لیمو','ترش و شیرین','🍋',125],['براونی','داغ با بستنی','🍫',145]]},
 
  {id:'dess', t:'دسر', s:'شیرینی آخر غذا', e:'🍨', items:[
  ['تیرامیسو','قهوه و ماسکارپونه','🍮',155],['پاناکوتا','با سس انگبین','🍮',140],['بستنی سنتی','زعفرانی با پسته','🍦',90],
  ['وافل میوه‌ای','موز، توت و شکلات','🧇',165],['کرم‌کارامل','کلاسیک و لطیف','🍮',100],['دونات','گلاسه با ترافل','🍩',70]]},

  {id:'main', t:'غذا و پاستا', s:'وعده اصلی', e:'🍝', items:[
  ['پاستا آلفردو','مرغ، قارچ و خامه','🍝',230],['پنه آربیاتا','سس تند گوجه','🌶️',200],['لازانیا','گوشت و پنیر گریل‌شده','🧀',250,1],
  ['پیتزا مارگاریتا','موزارلا و ریحان تازه','🍕',220],['ماکارونی مرغ','با قارچ و پنیر','🍗',190],['سوپ جو','با سبزیجات','🍲',100]]},
 
  {id:'salad',t:'سالاد', s:'سبک و سالم', e:'🥗', items:[
  ['سزار','مرغ گریل، پارمزان، کروتان','🥗',180],['یونانی','فتا، زیتون، خیار','🫒',165],['کینوا و آووکادو','با سس لیمو','🥑',195,1],
  ['سالاد فصل','سبزی‌های تازه روز','🥬',110],['توت و گردو','اسفناج، توت و پنیر بز','🫐',175]]},
 
  {id:'snack',t:'تنقلات', s:'کنار قهوه', e:'🍪', items:[
  ['کوکی شکلاتی','چیپس شکلات و گردو','🍪',55],['پاپ‌کورن کاراملی','تازه و ترد','🍿',60],['سیب‌زمینی سرخ‌کرده','با سس مخصوص','🍟',90],
  ['آجیل مخلوط','برشته‌شده','🥜',85],['چیپس سیب‌زمینی خانگی','با نمک دریا','🥔',65],['میوه فصل','بشقاب میوه تازه','🍇',110]]}
];

const fa = n => (n*1000).toLocaleString('fa-IR');
const catsEl = document.getElementById('cats'), menuEl = document.getElementById('menu');

function itemHTML(i,c,n){
  // عکس هر آیتم: اگر فیلد ششم را ننوشتید، به‌طور خودکار images/{id دسته}-{شماره}.jpg خوانده می‌شود
  const src = i[5] || `images/${c.id}-${n+1}.jpg`;
  return `<div class="col-6 col-md-4 col-lg-3"><article class="item">
    <div class="pic">${i[4]?'<span class="badge-new">پیشنهاد</span>':''}<span aria-hidden="true">${i[2]}</span>
      <img src="${src}" alt="${i[0]}" loading="lazy" onerror="this.remove()"></div>
    <div class="body"><h3>${i[0]}</h3><p>${i[1]}</p><div class="price">${fa(i[3])}<small>تومان</small></div></div></article></div>`;
}
function sectionHTML(c){
  return `<div class="sec-head"><div class="big">${c.e}</div><div><h2>${c.t}</h2><small>${c.s}</small></div><div class="line"></div></div>
  <div class="row g-3">${c.items.map((i,n)=>itemHTML(i,c,n)).join('')}</div>`;
}

// دکمه‌ها
const all = {id:'all', t:'همه', e:'✨'};
[all, ...MENU].forEach(c=>{
  const b = document.createElement('button');
  b.className='cat-btn'; b.dataset.id=c.id; b.setAttribute('role','tab');
  b.innerHTML=`<span class="em">${c.e}</span>${c.t}`;
  b.onclick=()=>show(c.id,true);
  catsEl.appendChild(b);
});
// پنل‌ها
MENU.forEach(c=>{
  const p=document.createElement('section'); p.className='panel'; p.id='p-'+c.id; p.innerHTML=sectionHTML(c); menuEl.appendChild(p);
});

function show(id,scroll){
  document.querySelectorAll('.cat-btn').forEach(b=>{
    const on=b.dataset.id===id; b.classList.toggle('active',on); b.setAttribute('aria-selected',on);
    if(on) b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('show', id==='all' || p.id==='p-'+id));
  if(scroll) window.scrollTo({top:document.querySelector('.hero').offsetHeight-30,behavior:'smooth'});
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
const start = location.hash.slice(1);
show(MENU.some(c=>c.id===start)||start==='all' ? start : MENU[0].id,false);
</script>
</body>
</html>
